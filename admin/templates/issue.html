{% extends "base.html" %}
{% block title %}Issue Certificate - LightPKI Admin{% endblock %}
{% block content %}
<h2>Issue New Certificate</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Common Name (CN)
    <input type="text" name="cn" value="{{ cn or '' }}" placeholder="ftp.example.com or *.example.com" required>
  </label>
  <label>Organizational Unit (OU)
    <input type="text" name="ou" value="{{ ou or '' }}" placeholder="FTP Server" required>
  </label>
  <label>Certificate Type
    <select name="extension">
      {% for e in extensions %}
      <option value="{{ e }}" {% if e == extension %}selected{% endif %}>{{ e }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Key Type
    <select name="key_spec">
      {% for value, label in key_specs.items() %}
      <option value="{{ value }}" {% if value == key_spec %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Additional SAN entries (optional)
    <input type="text" name="sans" value="{{ sans or '' }}" placeholder="api.example.com, 10.0.0.5, *.example.com">
  </label>
  <p><small>Comma-separated hostnames and/or IP addresses. The CN above is always included as a SAN automatically.</small></p>
  <label>Validity (days)
    <input type="number" name="cert_days" value="{{ cert_days or 3650 }}" min="1" max="36500" required>
  </label>
  <button type="submit">Issue Certificate</button>
</form>
{% endblock %}
